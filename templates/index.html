<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>VoiceSphere AI</title>
<style>
body{font-family:Arial;background:#f5f8ff;margin:0}
.container{max-width:1000px;margin:auto;padding:20px}
#chat{height:400px;overflow:auto;background:white;border-radius:12px;padding:10px}
.msg{margin:8px;padding:10px;border-radius:10px;background:#eef}
.mic{width:80px;height:80px;border-radius:50%;border:none;font-size:30px}
</style></head>
<body>
<div class="container">
<h1>🎙 VoiceSphere AI Assistant</h1>
<div id="chat"></div>
<input id="msg" placeholder="Type message">
<button onclick="sendMsg()">Send</button>
<button class="mic" id="mic">🎤</button>
</div>
<script>
const chat=document.getElementById("chat");
function add(t){chat.innerHTML+=`<div class="msg">${t}</div>`;chat.scrollTop=chat.scrollHeight;}
async function sendMsg(){
 let m=document.getElementById("msg").value;
 add("You: "+m);
 let r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m})});
 let d=await r.json();
 add("AI: "+d.reply);
 speechSynthesis.speak(new SpeechSynthesisUtterance(d.reply));
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
 let rec=new SR(); rec.continuous=true;
 document.getElementById("mic").onclick=()=>rec.start();
 rec.onresult=(e)=>{document.getElementById("msg").value=e.results[e.results.length-1][0].transcript;}
}
</script></body></html>
